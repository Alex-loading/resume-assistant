<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下一站 · 校园招聘申请（练习）</title><link rel="stylesheet" href="../extension/styles.css"></head><body>
<div class="demo-banner">简历匣练习表单 · 仅保存在页面内 · 不发送申请</div><main class="demo-container"><span class="eyebrow">NEXT CHAPTER / CAMPUS 2027</span><h1>你好，未来的同事。</h1><p>打开浏览器工具栏的简历匣，点击输入框，试试侧栏自动匹配、填入和撤销。</p>
<form id="application"><fieldset><legend>基本信息</legend><div class="demo-grid"><label>姓名<input id="full-name" name="fullName" autocomplete="name"></label><label>手机号码<input name="mobile" type="tel" autocomplete="tel"></label><label>电子邮箱<input name="email" type="email" autocomplete="email"></label><label>现居城市<input name="currentCity" value="南京"></label><label>性别<select name="gender"><option value="">请选择</option><option value="male">男</option><option value="female">女</option></select></label><label>出生日期<input name="birthday" type="date"></label><label>求职意向<input name="desiredPosition"></label><label>紧急联系人姓名<input name="emergencyName"></label><label>验证码<input name="captcha"></label><label>登录密码<input name="password" type="password"></label><input type="hidden" name="hiddenName"><label>只读姓名<input name="readonlyName" value="保留此项" readonly></label><label>已禁用邮箱<input name="disabledEmail" type="email" disabled></label></div></fieldset>
<fieldset><legend>教育经历</legend><div class="demo-grid"><label>学校名称<input name="school"></label><label>学院<input name="college"></label><label>专业名称<input name="major"></label><label>最高学历<select name="degree"><option value="">请选择</option><option value="bachelor">本科</option><option value="master">硕士研究生</option><option value="phd">博士研究生</option></select></label><label>GPA<input name="gpa"></label><label>成绩排名<input name="academicRanking"></label><label>入学时间<input name="educationStart" type="month"></label><label>毕业时间<input name="graduationDate" type="month"></label><label>导师<input name="advisor"></label></div></fieldset>
<fieldset><legend>实习经历</legend><div class="demo-grid"><label>公司名称<input name="company"></label><label>职位名称<input name="jobTitle"></label><label>开始时间<input name="startDate" type="month"></label><label>结束时间<input name="endDate" type="month"></label><label class="full">工作内容<textarea name="jobDescription"></textarea></label></div></fieldset>
<fieldset><legend>更多关于你</legend><div class="demo-grid"><label class="full">自我介绍<textarea name="summary"></textarea></label><label class="full">专业技能<textarea name="skills"></textarea></label><label>附件<input name="resume" type="file"></label></div></fieldset>
<div class="demo-actions"><button type="submit" class="button primary">检查练习表单</button><button type="reset" class="button outline">重置</button><span id="result" role="status">尚未检查</span></div></form><p>未展示的动态表单、跨域嵌入页和自定义控件可能需要手动填写。</p></main><script src="recruitment.js"></script></body></html>
